tests:
  - description: "testAddWindowFields - partition, sort, documents frame, and multiple accumulators"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - Field: genre
              sort:
                - Ordering:
                    - Field: published
                    - ASCENDING
              documents:
                DocumentWindowFrame:
                  preceding: unbounded
                  following: current
          fields:
            - AliasedExpression:
                - FunctionExpression.sum:
                    - Field: rating
                - "running_rating"
            - AliasedExpression:
                - Count
                - "running_count"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - genre
          - running_rating
          - running_count
    assert_results:
      - title: "1984"
        genre: "Dystopian"
        running_rating: 4.2
        running_count: 1
      - title: "Dune"
        genre: "Science Fiction"
        running_rating: 4.6
        running_count: 1
      - title: "The Hitchhiker's Guide to the Galaxy"
        genre: "Science Fiction"
        running_rating: 8.8
        running_count: 2
      - title: "The Handmaid's Tale"
        genre: "Dystopian"
        running_rating: 8.3
        running_count: 2
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                documents:
                  mapValue:
                    fields:
                      following:
                        stringValue: current
                      preceding:
                        stringValue: unbounded
                partition:
                  arrayValue:
                    values:
                    - fieldReferenceValue: genre
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: published
          - mapValue:
              fields:
                running_count:
                  functionValue:
                    name: count
                running_rating:
                  functionValue:
                    args:
                    - fieldReferenceValue: rating
                    name: sum
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                genre:
                  fieldReferenceValue: genre
                running_count:
                  fieldReferenceValue: running_count
                running_rating:
                  fieldReferenceValue: running_rating
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - rank and accumulator-level over() frames"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: rating
                    - ASCENDING
          fields:
            - AliasedExpression:
                - Rank
                - "rating_rank"
            - AliasedExpression:
                - FunctionExpression.over:
                    - FunctionExpression.sum:
                        - Field: published
                    - WindowSpec:
                        range:
                          RangeWindowFrame:
                            preceding: 0.15
                            following: 0.15
                - "nearby_published_sum"
            - AliasedExpression:
                - FunctionExpression.over:
                    - Count
                    - WindowSpec:
                        documents:
                          DocumentWindowFrame:
                            preceding: -1
                            following: 2
                - "look_ahead_count"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - rating
          - rating_rank
          - nearby_published_sum
          - look_ahead_count
    assert_results:
      - title: "1984"
        rating: 4.2
        rating_rank: 2
        nearby_published_sum: 5913
        look_ahead_count: 2
      - title: "Dune"
        rating: 4.6
        rating_rank: 4
        nearby_published_sum: 1965
        look_ahead_count: 0
      - title: "The Hitchhiker's Guide to the Galaxy"
        rating: 4.2
        rating_rank: 2
        nearby_published_sum: 5913
        look_ahead_count: 1
      - title: "The Handmaid's Tale"
        rating: 4.1
        rating_rank: 1
        nearby_published_sum: 5913
        look_ahead_count: 2
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: rating
          - mapValue:
              fields:
                look_ahead_count:
                  functionValue:
                    args:
                    - functionValue:
                        name: count
                    - mapValue:
                        fields:
                          documents:
                            mapValue:
                              fields:
                                following:
                                  integerValue: '2'
                                preceding:
                                  integerValue: '-1'
                    name: over
                nearby_published_sum:
                  functionValue:
                    args:
                    - functionValue:
                        args:
                        - fieldReferenceValue: published
                        name: sum
                    - mapValue:
                        fields:
                          range:
                            mapValue:
                              fields:
                                following:
                                  doubleValue: 0.15
                                preceding:
                                  doubleValue: 0.15
                    name: over
                rating_rank:
                  functionValue:
                    name: rank
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                look_ahead_count:
                  fieldReferenceValue: look_ahead_count
                nearby_published_sum:
                  fieldReferenceValue: nearby_published_sum
                rating:
                  fieldReferenceValue: rating
                rating_rank:
                  fieldReferenceValue: rating_rank
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - range frame with time unit"
    pipeline:
      - Collection: timestamps
      - AddWindowFields:
          window:
            WindowSpec:
              sort:
                - Ordering:
                    - Field: time
                    - ASCENDING
              range:
                RangeWindowFrame:
                  preceding: 12
                  following: current
                  unit: hour
          fields:
            - AliasedExpression:
                - Count
                - "window_count"
      - Select:
          - window_count
    assert_results:
      - window_count: 1
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /timestamps
          name: collection
        - args:
          - mapValue:
              fields:
                range:
                  mapValue:
                    fields:
                      following:
                        stringValue: current
                      preceding:
                        integerValue: '12'
                      unit:
                        stringValue: hour
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: time
          - mapValue:
              fields:
                window_count:
                  functionValue:
                    name: count
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                window_count:
                  fieldReferenceValue: window_count
          name: select
  - description: "testAddWindowFields - expression partition, multiple sorts, array_agg, and nested alias"
    pipeline:
      - Collection: books
      - Where:
          - FunctionExpression.equal_any:
              - Field: genre
              - [Science Fiction, Dystopian]
      - AddWindowFields:
          window:
            WindowSpec:
              partition:
                - FunctionExpression.to_upper:
                    - Field: genre
              sort:
                - Ordering:
                    - Field: published
                    - ASCENDING
                - Ordering:
                    - Field: title
                    - ASCENDING
              documents:
                DocumentWindowFrame:
                  preceding: unbounded
                  following:
                    Constant: 0
          fields:
            - AliasedExpression:
                - FunctionExpression.sum:
                    - Field: published
                - "stats.running_published"
            - AliasedExpression:
                - FunctionExpression.array_agg:
                    - Field: title
                - "running_titles"
      - Sort:
          - Ordering:
              - Field: published
              - ASCENDING
      - Select:
          - title
          - stats
          - running_titles
    assert_results:
      - title: "1984"
        stats:
          running_published: 1949
        running_titles:
          - "1984"
      - title: "Dune"
        stats:
          running_published: 1965
        running_titles:
          - "Dune"
      - title: "The Hitchhiker's Guide to the Galaxy"
        stats:
          running_published: 3944
        running_titles:
          - "Dune"
          - "The Hitchhiker's Guide to the Galaxy"
      - title: "The Handmaid's Tale"
        stats:
          running_published: 3934
        running_titles:
          - "1984"
          - "The Handmaid's Tale"
    assert_proto:
      pipeline:
        stages:
        - args:
          - referenceValue: /books
          name: collection
        - args:
          - functionValue:
              args:
              - fieldReferenceValue: genre
              - functionValue:
                  args:
                  - stringValue: Science Fiction
                  - stringValue: Dystopian
                  name: array
              name: equal_any
          name: where
        - args:
          - mapValue:
              fields:
                documents:
                  mapValue:
                    fields:
                      following:
                        integerValue: '0'
                      preceding:
                        stringValue: unbounded
                partition:
                  arrayValue:
                    values:
                    - functionValue:
                        args:
                        - fieldReferenceValue: genre
                        name: to_upper
                sort:
                  arrayValue:
                    values:
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: published
                    - mapValue:
                        fields:
                          direction:
                            stringValue: ascending
                          expression:
                            fieldReferenceValue: title
          - mapValue:
              fields:
                running_titles:
                  functionValue:
                    args:
                    - fieldReferenceValue: title
                    name: array_agg
                stats.running_published:
                  functionValue:
                    args:
                    - fieldReferenceValue: published
                    name: sum
          name: add_window_fields
        - args:
          - mapValue:
              fields:
                direction:
                  stringValue: ascending
                expression:
                  fieldReferenceValue: published
          name: sort
        - args:
          - mapValue:
              fields:
                running_titles:
                  fieldReferenceValue: running_titles
                stats:
                  fieldReferenceValue: stats
                title:
                  fieldReferenceValue: title
          name: select
  - description: "testAddWindowFields - error on range frame without sort"
    pipeline:
      - Collection: books
      - AddWindowFields:
          window:
            WindowSpec:
              range:
                RangeWindowFrame:
                  preceding: unbounded
                  following: current
          fields:
            - AliasedExpression:
                - Count
                - "window_count"
    assert_error: ".*range.*"

