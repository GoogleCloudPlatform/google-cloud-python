steps:
  - name: 'us-central1-docker.pkg.dev/client-library-releases/release-images-prod/python-multi@sha256:d529954c373542171f9fc411e0102cebe542b511e320a965edf8820285f4f122'
    id: 'run-system-tests-shard'
    env:
      # Populate standard GCP project environment variables expected by system test suites.
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - 'GCLOUD_PROJECT=${PROJECT_ID}'
      - 'PROJECT_ID=${PROJECT_ID}'
      # Pass sharding and diff parameters consumed by ci/get_package_shards.py.
      - 'MAX_SHARDS=${_MAX_SHARDS}'
      - 'SHARD_INDEX=${_SHARD_INDEX}'
      - 'BUILD_TYPE=${_BUILD_TYPE}'
      - 'TARGET_BRANCH=${_BASE_BRANCH}'
      - 'TEST_ALL_PACKAGES=${_TEST_ALL_PACKAGES}'
      - 'ENABLED_PACKAGES=${_ENABLED_PACKAGES}'
      - 'PACKAGE_WEIGHTS=${_PACKAGE_WEIGHTS}'
      # Specify the nox session consumed by ci/run_conditional_tests.sh and ci/run_single_test.sh.
      - 'NOX_SESSION=${_NOX_SESSION}'
      - 'TEST_TYPE=${_NOX_SESSION}'
      # Configure parallel package execution and unbuffered Python output for real-time logging.
      - 'PARALLEL_WORKERS=${_PARALLEL_WORKERS}'
      - 'PYTHONUNBUFFERED=1'
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      # Derive PY_VERSION (e.g. "3.12" from "system-3.12") required by ci/run_single_test.sh.
      export PY_VERSION="${NOX_SESSION#system-}"

      # Deepen both the checked-out PR commit and target branch history so git diff in
      # ci/get_package_shards.py finds the merge base in Cloud Build's shallow checkout,
      # and populate local refs/heads/${TARGET_BRANCH} so ci/run_conditional_tests.sh's
      # local insteadOf fetch succeeds silently.
      git fetch --no-tags --quiet origin \
        "$(git rev-parse HEAD)" \
        "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
        "+refs/heads/${TARGET_BRANCH}:refs/heads/${TARGET_BRANCH}" \
        --depth=200 || true

      # Import ci/get_package_shards.py without modifying the script on disk.
      # Filter get_packages() in memory to _ENABLED_PACKAGES so unmigrated packages are ignored.
      PACKAGE_LIST=$(python3 -c '
      import os, sys

      sys.path.insert(0, "ci")
      import get_package_shards as gps

      enabled = {
          p.strip().rstrip("/") + "/"
          for p in os.environ.get("ENABLED_PACKAGES", "").replace(",", " ").split()
          if p.strip()
      }
      if enabled:
          orig_get_packages = gps.get_packages
          def filtered_get_packages(*args, **kwargs):
              pkgs = {}
              for name, paths in orig_get_packages(*args, **kwargs).items():
                  kept = [p for p in paths if p in enabled]
                  if kept:
                      pkgs[name] = kept
              return pkgs
          gps.get_packages = filtered_get_packages

      packages = gps.get_packages_to_test()
      shards = gps.group_packages(packages)

      idx = int(os.environ.get("SHARD_INDEX", "0"))
      print(shards[idx].get("packages", "") if idx < len(shards) else "")
      ')

      # Report immediate green (< 10s) if no enabled packages in this PR map to this shard index.
      if [[ -z "${PACKAGE_LIST}" ]]; then
        echo "No enabled packages assigned to shard ${SHARD_INDEX}. Exiting 0."
        exit 0
      fi

      # Create runtime shims in /tmp/cloudbuild_shims so tracked repo files remain unmodified:
      # - cloudbuild_pytest_plugin.py: Unsets the placeholder GOOGLE_APPLICATION_CREDENTIALS
      #   value ("CLOUD_BUILD_ADC" satisfies noxfile.py's env check) so google.auth.default()
      #   uses Cloud Build VM ADC, and flushes per-test results so `py.test --quiet` logs live.
      # - nox wrapper: Streams [package]-prefixed output to fd 3 in real time across parallel
      #   workers, and only writes to stdout on failure so run_conditional_tests.sh does not
      #   print passing logs twice.
      mkdir -p /tmp/cloudbuild_shims
      cat << 'EOF' > /tmp/cloudbuild_shims/cloudbuild_pytest_plugin.py
      import os

      if os.environ.get("GOOGLE_APPLICATION_CREDENTIALS") == "CLOUD_BUILD_ADC":
          os.environ.pop("GOOGLE_APPLICATION_CREDENTIALS", None)


      def pytest_runtest_logreport(report):
          if report.when == "call" or (
              report.when in ("setup", "teardown") and report.failed
          ):
              print(
                  f"{report.outcome.upper()} {report.nodeid} ({report.duration:.1f}s)",
                  flush=True,
              )
      EOF

      cat << 'EOF' > /tmp/cloudbuild_shims/nox
      #!/usr/bin/env bash
      PKG=$(basename "$PWD")
      REAL_NOX=$(which -a nox | grep -v '/tmp/cloudbuild_shims' | head -n 1)
      TMP_LOG=$(mktemp)
      echo "[${PKG}] Starting nox $*" >&3
      "$REAL_NOX" "$@" 2>&1 | awk -v p="[${PKG}] " -v f="${TMP_LOG}" '{
        print $0 > f; fflush(f);
        print p $0 > "/dev/fd/3"; fflush("/dev/fd/3");
      }'
      RET=${PIPESTATUS[0]}
      if [[ ${RET} -ne 0 ]]; then
        cat "${TMP_LOG}"
      fi
      rm -f "${TMP_LOG}"
      exit ${RET}
      EOF
      chmod +x /tmp/cloudbuild_shims/nox

      if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
        export GOOGLE_APPLICATION_CREDENTIALS="CLOUD_BUILD_ADC"
      fi
      export PATH="/tmp/cloudbuild_shims:${PATH}"
      export PYTHONPATH="/tmp/cloudbuild_shims${PYTHONPATH:+:${PYTHONPATH}}"
      export PYTEST_ADDOPTS="-p cloudbuild_pytest_plugin ${PYTEST_ADDOPTS:-}"
      exec 3>&1

      # Export PACKAGE_LIST and delegate execution to the existing monorepo test runner script.
      export PACKAGE_LIST
      echo "=== System Shard ${SHARD_INDEX}/${MAX_SHARDS} running ${NOX_SESSION} for: ${PACKAGE_LIST} ==="
      ./ci/run_conditional_tests.sh

# Hard 30-minute (1800s) CI timeout ceiling.
timeout: 1800s

substitutions:
  _MAX_SHARDS: '1'
  _SHARD_INDEX: '0'
  _PARALLEL_WORKERS: '4'
  _BUILD_TYPE: 'presubmit'
  _BASE_BRANCH: 'main'
  _TEST_ALL_PACKAGES: 'false'
  _ENABLED_PACKAGES: 'packages/google-cloud-bigquery-storage'
  _NOX_SESSION: 'system-3.12'
  _PACKAGE_WEIGHTS: >-
    google-cloud-bigquery-storage:5

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
